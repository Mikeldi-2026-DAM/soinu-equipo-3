<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}SOINU{% endblock %} · SOINU</title>
  <style>
    :root {
      --fondo: #0f0f14;
      --tarjeta: #1b1b24;
      --texto: #f2f2f2;
      --suave: #a9a9b8;
      --acento: #ff4d6d;
      --acento-2: #ffd166;
      --ok: #3ddc97;
      --error: #ff6b6b;
      --borde: #2d2d3a;
      --radio: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      line-height: 1.5;
    }
    a { color: var(--acento-2); }
    header {
      background: linear-gradient(90deg, var(--acento), #8338ec);
      padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem;
    }
    header .logo { font-size: 1.8rem; font-weight: 900; letter-spacing: .3rem; color: #fff; text-decoration: none; }
    header nav a { color: #fff; margin-left: 1rem; text-decoration: none; font-weight: 600; }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { margin-top: 0; }
    .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
    .tarjeta {
      background: var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio);
      padding: 1.2rem; display: flex; flex-direction: column; gap: .4rem;
    }
    .tarjeta.agotada { opacity: .55; }
    .precio { font-size: 1.6rem; font-weight: 800; color: var(--acento-2); }
    .plazas { color: var(--suave); font-size: .9rem; }
    .etiqueta-agotada { color: var(--error); font-weight: 800; text-transform: uppercase; }
    .boton {
      display: inline-block; background: var(--acento); color: #fff; border: 0; border-radius: 8px;
      padding: .6rem 1.1rem; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 1rem;
    }
    .boton.secundario { background: transparent; border: 1px solid var(--suave); color: var(--texto); }
    .boton:disabled { background: var(--borde); cursor: not-allowed; }
    form.compra { display: grid; gap: .8rem; max-width: 420px; }
    label { display: grid; gap: .25rem; font-weight: 600; }
    input {
      padding: .55rem; border-radius: 8px; border: 1px solid var(--borde);
      background: #11111a; color: var(--texto); font-size: 1rem;
    }
    .aviso-error {
      background: rgba(255,107,107,.12); border: 1px solid var(--error); color: var(--error);
      padding: .7rem 1rem; border-radius: 8px;
    }
    .aviso-ok {
      background: rgba(61,220,151,.12); border: 1px solid var(--ok); color: var(--ok);
      padding: .7rem 1rem; border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid var(--borde); }
    .codigo { font-family: monospace; font-size: 1.3rem; color: var(--acento-2); letter-spacing: .1rem; }
    footer { text-align: center; color: var(--suave); font-size: .85rem; padding: 1rem; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">SOINU</a>
    <nav>
      <a href="/">Entradas</a>
      <a href="/compras">Organizador</a>
    </nav>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
  <footer>SOINU · Festival de música · Proyecto de 2.º DAM</footer>
</body>
</html>
